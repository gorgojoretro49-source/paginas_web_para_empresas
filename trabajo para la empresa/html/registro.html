<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse | Taller de Motos Carlos Zampedri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="contenedor-form">
    <h1 class="titulo">Registrarse</h1>
    <p id="msg" style="display:none;color:#ff6b6b;text-align:center;margin-bottom:1rem;"></p>
    <form action="../php/registro.php" method="POST">
      <div class="campos">
        <div class="campo">
          <label for="txtusuario">Usuario:</label>
          <input type="text" id="txtusuario" name="txtusuario" required>
        </div>
        <div class="campo">
          <label for="txtpassword">Contraseña:</label>
          <input type="password" id="txtpassword" name="txtpassword" required>
        </div>
      </div>
      <p class="boton">
        <input type="submit" value="Registrarse">
      </p>
      <p class="registro-link">
        <a href="login.html">¿Ya tenés cuenta? Iniciar sesión</a>
      </p>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const msg = document.getElementById('msg');
    if (params.get('error') === 'existe') { msg.textContent = 'Ese nombre de usuario ya existe. Probá con otro.'; msg.style.display='block'; }
    else if (params.get('error') === '1') { msg.textContent = 'No se pudo completar el registro. Volvé a intentar.'; msg.style.display='block'; }
  </script>
</body>
</html>
